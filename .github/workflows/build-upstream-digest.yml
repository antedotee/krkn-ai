name: Build Upstream Digest

# Regenerates .docs-sync-digest/ for krkn-ai on every change to the CLI
# source. The output is consumed by docs-sync's relevance gate in the
# website fork — when an upstream PR merges, the website pipeline reads
# .docs-sync-digest/llms-full.txt at the head and base refs to detect
# what user-facing surface changed.

permissions:
  contents: write

on:
  push:
    branches: [main, docs-sync-test]
    paths:
      # The CLI is the only documented surface in V1 (slice 4).
      - 'krkn_ai/cli/**'
      - '.docs-sync/**'
      - '.github/workflows/build-upstream-digest.yml'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual rebuild'
        required: false
        default: 'Manual trigger'

concurrency:
  group: build-upstream-digest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build upstream digest
        run: python .docs-sync/build_upstream_digest.py --repo-name krkn-ai

      - name: Commit digest back if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .docs-sync-digest/
          if git diff --staged --quiet; then
            echo '::notice::Digest unchanged — no commit needed.'
            exit 0
          fi
          git commit -m "chore(docs-sync): regenerate upstream digest

          Auto-regenerated by .github/workflows/build-upstream-digest.yml after
          changes to the CLI surface. Source commit: ${GITHUB_SHA::7}."
          git push origin HEAD:${GITHUB_REF#refs/heads/}
          echo '::notice::Digest committed.'
